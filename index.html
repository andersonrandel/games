<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boba Bounce 🧋</title>
<style>
  :root {
    --ui: #fff6ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #14101a;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ui);
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
  }
  h1 {
    font-size: clamp(20px, 4vw, 34px);
    letter-spacing: 1px;
    text-shadow: 0 0 14px rgba(255,150,220,.6);
  }
  #hud {
    display: flex;
    gap: 28px;
    font-size: clamp(14px, 2.5vw, 20px);
    font-weight: bold;
  }
  #hud span { color: #ffd6f5; }
  canvas {
    /* Scale to fit any screen while keeping the 480:640 (3:4) shape.
       Bounded by width, by available height, and never upscaled past native. */
    width: min(480px, 94vw, (100dvh - 150px) * 0.75);
    height: auto;
    aspect-ratio: 480 / 640;
    max-width: 94vw;
    border-radius: 18px;
    box-shadow: 0 12px 50px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.06);
    background: radial-gradient(120% 120% at 50% 0%, #2a1f3d 0%, #160f24 70%);
    touch-action: none;
    cursor: none;
  }
  #hint {
    font-size: 13px;
    opacity: .7;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(10,7,16,.82);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: clamp(26px, 6vw, 48px); text-shadow: 0 0 18px rgba(255,160,220,.7); }
  #overlay p { max-width: 460px; line-height: 1.5; opacity: .9; }
  button {
    font: inherit;
    font-weight: bold;
    font-size: 18px;
    color: #2a1230;
    background: linear-gradient(180deg, #ffd1ee, #ff9ad4);
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,140,210,.4);
    transition: transform .08s ease;
  }
  button:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="wrap">
  <h1>🧋 Boba Bounce</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
    <div>Lives: <span id="lives">❤❤❤</span></div>
  </div>
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">Move the sparkly bar with your mouse, finger, or ← → keys</div>
</div>

<div id="overlay">
  <h2>🧋 Boba Bounce</h2>
  <p>A color-shifting boba tea bounces on a sparkly, color-changing bar.
     Keep it from falling! Every bounce earns points and speeds things up.</p>
  <button id="startBtn">Start Bouncing</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const overlayH = overlay.querySelector('h2');
  const overlayP = overlay.querySelector('p');
  const startBtn = document.getElementById('startBtn');

  let best = +(localStorage.getItem('bobaBest') || 0);
  bestEl.textContent = best;

  // ---- Game state ----
  const state = {
    running: false,
    score: 0,
    lives: 3,
    t: 0,
  };

  // The bouncing boba cup
  const boba = {
    x: W / 2,
    y: 140,
    r: 26,
    vx: 2.4,
    vy: 0,
    hue: 320,
  };

  // The sparkly bar (paddle)
  const bar = {
    w: 140,
    h: 20,
    x: W / 2,
    y: H - 56,
    hue: 200,
    targetX: W / 2,
  };

  const GRAVITY = 0.32;
  let baseBounce = 9.6;

  // Sparkle particles living on the bar
  const sparkles = [];
  for (let i = 0; i < 26; i++) {
    sparkles.push({
      off: Math.random(),          // position along the bar (0..1)
      yoff: (Math.random() - 0.5), // vertical jitter within bar
      phase: Math.random() * Math.PI * 2,
      speed: 0.04 + Math.random() * 0.08,
      size: 1 + Math.random() * 2.4,
    });
  }

  // Splash particles when bouncing
  const splashes = [];
  function emitSplash(x, y, hue) {
    for (let i = 0; i < 14; i++) {
      const a = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9;
      const sp = 1.5 + Math.random() * 3.5;
      splashes.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        hue: hue + (Math.random() - 0.5) * 40,
        r: 2 + Math.random() * 3,
      });
    }
  }

  // ---- Input ----
  function setTarget(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    bar.targetX = (clientX - rect.left) * scale;
  }
  canvas.addEventListener('mousemove', e => setTarget(e.clientX));
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    setTarget(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchstart', e => setTarget(e.touches[0].clientX), { passive: true });

  const keys = { left: false, right: false };
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  });
  addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  // ---- Game flow ----
  function reset() {
    state.score = 0;
    state.lives = 3;
    state.t = 0;
    baseBounce = 9.6;
    boba.x = W / 2;
    boba.y = 140;
    boba.vx = (Math.random() < 0.5 ? -1 : 1) * 2.4;
    boba.vy = 0;
    bar.x = bar.targetX = W / 2;
    splashes.length = 0;
    updateHud();
  }

  function start() {
    reset();
    state.running = true;
    overlay.classList.add('hidden');
  }

  function loseLife() {
    state.lives--;
    updateHud();
    if (state.lives <= 0) {
      gameOver();
    } else {
      // respawn boba above the bar
      boba.x = bar.x;
      boba.y = 160;
      boba.vx = (Math.random() < 0.5 ? -1 : 1) * 2.4;
      boba.vy = 0;
    }
  }

  function gameOver() {
    state.running = false;
    if (state.score > best) {
      best = state.score;
      localStorage.setItem('bobaBest', best);
      bestEl.textContent = best;
    }
    overlayH.textContent = 'Game Over 🫧';
    overlayP.innerHTML = `You scored <b>${state.score}</b> bounces.<br>Best: <b>${best}</b>`;
    startBtn.textContent = 'Bounce Again';
    overlay.classList.remove('hidden');
  }

  function updateHud() {
    scoreEl.textContent = state.score;
    livesEl.textContent = '❤'.repeat(state.lives) + '🖤'.repeat(Math.max(0, 3 - state.lives));
  }

  // ---- Update ----
  function update() {
    state.t++;

    // keyboard nudges the target
    if (keys.left)  bar.targetX -= 8;
    if (keys.right) bar.targetX += 8;
    bar.targetX = Math.max(bar.w / 2, Math.min(W - bar.w / 2, bar.targetX));
    // smooth follow
    bar.x += (bar.targetX - bar.x) * 0.35;

    // color cycling
    boba.hue = (boba.hue + 0.8) % 360;
    bar.hue  = (bar.hue + 1.3) % 360;

    // boba physics
    boba.vy += GRAVITY;
    boba.x += boba.vx;
    boba.y += boba.vy;

    // wall bounce
    if (boba.x - boba.r < 0) { boba.x = boba.r; boba.vx = Math.abs(boba.vx); }
    if (boba.x + boba.r > W) { boba.x = W - boba.r; boba.vx = -Math.abs(boba.vx); }
    if (boba.y - boba.r < 0) { boba.y = boba.r; boba.vy = Math.abs(boba.vy) * 0.6; }

    // bar collision (only when falling)
    const barTop = bar.y - bar.h / 2;
    if (boba.vy > 0 &&
        boba.y + boba.r >= barTop &&
        boba.y + boba.r <= bar.y + bar.h &&
        boba.x > bar.x - bar.w / 2 - boba.r &&
        boba.x < bar.x + bar.w / 2 + boba.r) {
      boba.y = barTop - boba.r;
      boba.vy = -baseBounce;
      // english based on where it hit the bar
      const hit = (boba.x - bar.x) / (bar.w / 2); // -1..1
      boba.vx += hit * 3.2;
      boba.vx = Math.max(-7, Math.min(7, boba.vx));

      state.score++;
      baseBounce = Math.min(15, baseBounce + 0.12); // ramp difficulty
      updateHud();
      emitSplash(boba.x, barTop, bar.hue);
    }

    // fell off the bottom
    if (boba.y - boba.r > H) {
      loseLife();
    }

    // sparkles drift
    for (const s of sparkles) s.phase += s.speed;

    // splash particles
    for (let i = splashes.length - 1; i >= 0; i--) {
      const p = splashes[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.025;
      if (p.life <= 0) splashes.splice(i, 1);
    }
  }

  // ---- Draw ----
  function drawBackground() {
    // subtle moving glow following the boba's color
    const g = ctx.createRadialGradient(boba.x, boba.y, 10, boba.x, boba.y, 360);
    g.addColorStop(0, `hsla(${boba.hue}, 80%, 55%, 0.16)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBoba() {
    const { x, y, r, hue } = boba;
    ctx.save();
    ctx.translate(x, y);
    // squash based on vertical speed for a juicy feel
    const squash = Math.max(-0.18, Math.min(0.18, boba.vy * 0.012));
    ctx.scale(1 + squash, 1 - squash);

    // glow
    ctx.shadowColor = `hsla(${hue}, 90%, 60%, .9)`;
    ctx.shadowBlur = 22;

    // cup body (rounded, slightly tapered)
    ctx.beginPath();
    ctx.moveTo(-r, -r * 0.95);
    ctx.lineTo(r, -r * 0.95);
    ctx.lineTo(r * 0.78, r);
    ctx.lineTo(-r * 0.78, r);
    ctx.closePath();
    const body = ctx.createLinearGradient(0, -r, 0, r);
    body.addColorStop(0, `hsl(${hue}, 75%, 78%)`);
    body.addColorStop(1, `hsl(${hue}, 70%, 58%)`);
    ctx.fillStyle = body;
    ctx.fill();
    ctx.shadowBlur = 0;

    // lid
    ctx.fillStyle = `hsl(${hue}, 45%, 90%)`;
    ctx.beginPath();
    ctx.roundRect(-r - 2, -r * 1.18, (r + 2) * 2, r * 0.34, 5);
    ctx.fill();

    // dome lid top
    ctx.beginPath();
    ctx.ellipse(0, -r * 1.18, r * 0.55, r * 0.32, 0, Math.PI, 0);
    ctx.fillStyle = `hsl(${hue}, 45%, 95%)`;
    ctx.fill();

    // straw
    ctx.save();
    ctx.rotate(0.18);
    ctx.fillStyle = `hsl(${(hue + 180) % 360}, 80%, 60%)`;
    ctx.fillRect(-3.5, -r * 2.2, 7, r * 1.6);
    ctx.restore();

    // boba pearls
    ctx.fillStyle = 'rgba(35, 18, 10, 0.92)';
    const pearls = [[-9, r*0.55], [0, r*0.7], [9, r*0.55], [-4, r*0.25], [6, r*0.2]];
    for (const [px, py] of pearls) {
      ctx.beginPath();
      ctx.arc(px, py, 4.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // pearl highlights
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (const [px, py] of pearls) {
      ctx.beginPath();
      ctx.arc(px - 1.3, py - 1.3, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // shine on cup
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.4, -r * 0.2, r * 0.16, r * 0.5, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // little face :3
    ctx.fillStyle = 'rgba(40,20,30,.8)';
    ctx.beginPath(); ctx.arc(-7, -2, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -2, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,20,30,.8)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 1, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    // cheeks
    ctx.fillStyle = `hsla(${(hue+330)%360}, 90%, 70%, .5)`;
    ctx.beginPath(); ctx.arc(-12, 3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 3, 3, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawBar() {
    const { x, y, w, h, hue } = bar;
    const left = x - w / 2, top = y - h / 2;
    ctx.save();

    // glowing sparkly bar with a shifting multi-color gradient
    ctx.shadowColor = `hsla(${hue}, 95%, 60%, .9)`;
    ctx.shadowBlur = 26;
    const grad = ctx.createLinearGradient(left, 0, left + w, 0);
    grad.addColorStop(0,   `hsl(${hue}, 90%, 62%)`);
    grad.addColorStop(0.5, `hsl(${(hue + 60) % 360}, 90%, 68%)`);
    grad.addColorStop(1,   `hsl(${(hue + 120) % 360}, 90%, 62%)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(left, top, w, h, h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // glossy top highlight
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.roundRect(left + 4, top + 3, w - 8, h * 0.32, h * 0.16);
    ctx.fill();

    // sparkles twinkling on the bar
    for (const s of sparkles) {
      const sx = left + 8 + s.off * (w - 16);
      const sy = y + s.yoff * (h * 0.5);
      const tw = (Math.sin(s.phase) + 1) / 2; // 0..1 twinkle
      if (tw < 0.15) continue;
      const sz = s.size * (0.5 + tw);
      ctx.globalAlpha = tw;
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      // 4-point sparkle
      ctx.beginPath();
      ctx.moveTo(sx, sy - sz*2);
      ctx.lineTo(sx + sz*0.5, sy);
      ctx.lineTo(sx, sy + sz*2);
      ctx.lineTo(sx - sz*0.5, sy);
      ctx.closePath();
      ctx.moveTo(sx - sz*2, sy);
      ctx.lineTo(sx, sy + sz*0.5);
      ctx.lineTo(sx + sz*2, sy);
      ctx.lineTo(sx, sy - sz*0.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawSplashes() {
    for (const p of splashes) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = `hsl(${p.hue}, 85%, 65%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawSplashes();
    drawBar();
    drawBoba();
  }

  // ---- Main loop ----
  function loop() {
    if (state.running) update();
    render();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', start);
  // allow starting with space/enter
  addEventListener('keydown', e => {
    if (!state.running && (e.key === ' ' || e.key === 'Enter')) start();
  });

  reset();
  loop();
})();
</script>
</body>
</html>
