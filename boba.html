<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boba Bounce 🧋</title>
<style>
  :root { --ui:#fff6ee; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#14101a;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ui);overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 25% 15%,rgba(255,154,212,.28),transparent 22rem),radial-gradient(circle at 75% 20%,rgba(94,205,255,.18),transparent 20rem)}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:1}
  h1{font-size:clamp(20px,4vw,34px);letter-spacing:1px;text-shadow:0 0 14px rgba(255,150,220,.6)}
  .back{color:#ffd6f5;text-decoration:none;font-size:13px;font-weight:bold;opacity:.9}
  #hud{display:flex;gap:28px;font-size:clamp(14px,2.5vw,20px);font-weight:bold;flex-wrap:wrap;justify-content:center}
  #hud span{color:#ffd6f5}
  canvas{width:min(480px,94vw,(100dvh - 168px) * .75);height:auto;aspect-ratio:480/640;max-width:94vw;border-radius:18px;box-shadow:0 12px 50px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.06);background:radial-gradient(120% 120% at 50% 0%,#2a1f3d 0%,#160f24 70%);touch-action:none;cursor:none}
  #hint{font-size:13px;opacity:.75;text-align:center}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,7,16,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);text-align:center;padding:20px;z-index:4}
  #overlay.hidden{display:none}
  #overlay h2{font-size:clamp(26px,6vw,48px);text-shadow:0 0 18px rgba(255,160,220,.7)}
  #overlay p{max-width:460px;line-height:1.5;opacity:.9}
  button{font:inherit;font-weight:bold;font-size:18px;color:#2a1230;background:linear-gradient(180deg,#ffd1ee,#ff9ad4);border:none;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 8px 24px rgba(255,140,210,.4);transition:transform .08s ease}
  button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
  <h1>🧋 Boba Bounce</h1>
  <a class="back" href="index.html">← Game Portal</a>
  <div id="hud"><div>Score: <span id="score">0</span></div><div>Best: <span id="best">0</span></div><div>Lives: <span id="lives">❤❤❤</span></div></div>
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">Move the sparkly bar with your mouse, finger, or ← → keys</div>
</div>
<div id="overlay"><h2>🧋 Boba Bounce</h2><p>A color-shifting boba tea bounces on a sparkly, color-changing bar. Keep it from falling! Every bounce earns points and speeds things up.</p><button id="startBtn">Start Bouncing</button></div>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),overlayH=overlay.querySelector('h2'),overlayP=overlay.querySelector('p'),startBtn=document.getElementById('startBtn');
  let best=+(localStorage.getItem('bobaBest')||0);bestEl.textContent=best;
  const state={running:false,score:0,lives:3,t:0};
  const boba={x:W/2,y:140,r:26,vx:2.4,vy:0,hue:320};
  const bar={w:140,h:20,x:W/2,y:H-56,hue:200,targetX:W/2};
  const GRAVITY=.32;let baseBounce=9.6;
  const sparkles=Array.from({length:26},()=>({off:Math.random(),yoff:Math.random()-.5,phase:Math.random()*Math.PI*2,speed:.04+Math.random()*.08,size:1+Math.random()*2.4}));
  const splashes=[];
  function emitSplash(x,y,hue){for(let i=0;i<14;i++){const a=Math.PI+(Math.random()-.5)*Math.PI*.9,sp=1.5+Math.random()*3.5;splashes.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:hue+(Math.random()-.5)*40,r:2+Math.random()*3});}}
  function setTarget(clientX){const rect=canvas.getBoundingClientRect(),scale=W/rect.width;bar.targetX=(clientX-rect.left)*scale;}
  canvas.addEventListener('mousemove',e=>setTarget(e.clientX));
  canvas.addEventListener('touchmove',e=>{e.preventDefault();setTarget(e.touches[0].clientX);},{passive:false});
  canvas.addEventListener('touchstart',e=>setTarget(e.touches[0].clientX),{passive:true});
  const keys={left:false,right:false};
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;});
  addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;});
  function reset(){state.score=0;state.lives=3;state.t=0;baseBounce=9.6;boba.x=W/2;boba.y=140;boba.vx=(Math.random()<.5?-1:1)*2.4;boba.vy=0;bar.x=bar.targetX=W/2;splashes.length=0;updateHud();}
  function start(){reset();state.running=true;overlay.classList.add('hidden');}
  function loseLife(){state.lives--;updateHud();if(state.lives<=0)gameOver();else{boba.x=bar.x;boba.y=160;boba.vx=(Math.random()<.5?-1:1)*2.4;boba.vy=0;}}
  function gameOver(){state.running=false;if(state.score>best){best=state.score;localStorage.setItem('bobaBest',best);bestEl.textContent=best;}overlayH.textContent='Game Over 🫧';overlayP.innerHTML=`You scored <b>${state.score}</b> bounces.<br>Best: <b>${best}</b>`;startBtn.textContent='Bounce Again';overlay.classList.remove('hidden');}
  function updateHud(){scoreEl.textContent=state.score;livesEl.textContent='❤'.repeat(state.lives)+'🖤'.repeat(Math.max(0,3-state.lives));}
  function update(){state.t++;if(keys.left)bar.targetX-=8;if(keys.right)bar.targetX+=8;bar.targetX=Math.max(bar.w/2,Math.min(W-bar.w/2,bar.targetX));bar.x+=(bar.targetX-bar.x)*.35;boba.hue=(boba.hue+.8)%360;bar.hue=(bar.hue+1.3)%360;boba.vy+=GRAVITY;boba.x+=boba.vx;boba.y+=boba.vy;if(boba.x-boba.r<0){boba.x=boba.r;boba.vx=Math.abs(boba.vx);}if(boba.x+boba.r>W){boba.x=W-boba.r;boba.vx=-Math.abs(boba.vx);}if(boba.y-boba.r<0){boba.y=boba.r;boba.vy=Math.abs(boba.vy)*.6;}const barTop=bar.y-bar.h/2;if(boba.vy>0&&boba.y+boba.r>=barTop&&boba.y+boba.r<=bar.y+bar.h&&boba.x>bar.x-bar.w/2-boba.r&&boba.x<bar.x+bar.w/2+boba.r){boba.y=barTop-boba.r;boba.vy=-baseBounce;const hit=(boba.x-bar.x)/(bar.w/2);boba.vx+=hit*3.2;boba.vx=Math.max(-7,Math.min(7,boba.vx));state.score++;baseBounce=Math.min(15,baseBounce+.12);updateHud();emitSplash(boba.x,barTop,bar.hue);}if(boba.y-boba.r>H)loseLife();for(const s of sparkles)s.phase+=s.speed;for(let i=splashes.length-1;i>=0;i--){const p=splashes[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.025;if(p.life<=0)splashes.splice(i,1);}}
  function drawBackground(){const g=ctx.createRadialGradient(W/2,0,40,W/2,H*.45,H*.9);g.addColorStop(0,'#30214a');g.addColorStop(1,'#120d20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.16;for(let i=0;i<54;i++){const x=(i*73+state.t*.3)%W,y=(i*41+Math.sin(state.t*.01+i)*20)%H;ctx.fillStyle=i%2?'#ffd6f5':'#8fdcff';ctx.beginPath();ctx.arc(x,y,1.2+(i%4),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
  function drawCup(){ctx.save();ctx.translate(boba.x,boba.y);ctx.rotate(Math.sin(state.t*.045)*.09);const hue=boba.hue;const grad=ctx.createLinearGradient(-24,-30,24,28);grad.addColorStop(0,`hsl(${hue},95%,74%)`);grad.addColorStop(1,`hsl(${(hue+70)%360},95%,55%)`);ctx.fillStyle=grad;ctx.shadowColor=`hsl(${hue},95%,70%)`;ctx.shadowBlur=18;roundRect(-24,-30,48,58,12);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.5)';roundRect(-15,-23,10,38,6);ctx.fill();ctx.fillStyle='rgba(60,18,45,.72)';for(const [x,y] of [[-10,11],[5,15],[14,5],[-2,24]]){ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();}ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,-26);ctx.lineTo(18,-34);ctx.stroke();ctx.restore();}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
  function drawBar(){ctx.save();ctx.translate(bar.x,bar.y);const grad=ctx.createLinearGradient(-bar.w/2,0,bar.w/2,0);grad.addColorStop(0,`hsl(${bar.hue},100%,70%)`);grad.addColorStop(.5,'#fff');grad.addColorStop(1,`hsl(${(bar.hue+80)%360},100%,65%)`);ctx.shadowColor='#ffb4e8';ctx.shadowBlur=20;ctx.fillStyle=grad;roundRect(-bar.w/2,-bar.h/2,bar.w,bar.h,10);ctx.fill();ctx.shadowBlur=0;for(const s of sparkles){const x=-bar.w/2+s.off*bar.w,y=s.yoff*bar.h,tw=(Math.sin(s.phase)+1)/2;ctx.fillStyle=`rgba(255,255,255,${.25+.75*tw})`;ctx.font=`${9+s.size*2}px serif`;ctx.fillText('✦',x,y);}ctx.restore();}
  function drawSplashes(){for(const p of splashes){ctx.globalAlpha=p.life;ctx.fillStyle=`hsl(${p.hue},100%,70%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
  function draw(){drawBackground();drawSplashes();drawCup();drawBar();}
  function loop(){if(state.running)update();draw();requestAnimationFrame(loop);}startBtn.addEventListener('click',start);draw();loop();
})();
</script>
</body>
</html>
